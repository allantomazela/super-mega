<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="MEGA DOS MILIONÁRIOS">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="55%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="55%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0d0f12"/>
  <rect x="6" y="6" width="116" height="116" rx="24" fill="url(#bg)" opacity="0.95"/>
  <!-- Anel dourado -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#gold)" stroke-width="3.5" opacity="0.9"/>
  <circle cx="64" cy="64" r="40" fill="none" stroke="#ecfdf5" stroke-width="1" opacity="0.25"/>
  <!-- 6 bolas (volante) -->
  <g filter="url(#soft)">
    <circle cx="64" cy="34" r="11" fill="url(#ball)"/>
    <circle cx="90" cy="49" r="11" fill="url(#ball)"/>
    <circle cx="90" cy="79" r="11" fill="url(#ball)"/>
    <circle cx="64" cy="94" r="11" fill="url(#ball)"/>
    <circle cx="38" cy="79" r="11" fill="url(#ball)"/>
    <circle cx="38" cy="49" r="11" fill="url(#ball)"/>
  </g>
  <!-- Centro ouro -->
  <circle cx="64" cy="64" r="14" fill="url(#gold)"/>
  <circle cx="64" cy="64" r="9" fill="#0d0f12"/>
  <text x="64" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#fde68a">M</text>
</svg>
