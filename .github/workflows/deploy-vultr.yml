name: Publicar no Vultr

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vultr-super-mega
  cancel-in-progress: true

jobs:
  deploy:
    name: Build e enviar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sincronizar e exportar concursos do Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REQUIRED_SECRET: DATABASE_URL
          SKIP_IF_NO_URL: '1'
        run: |
          node scripts/sync-concursos-neon.mjs
          node scripts/export-concursos-json.mjs
      - name: Build (domínio na raiz)
        env:
          VITE_BASE_PATH: /
          VITE_NEON_AUTH_URL: https://ep-small-paper-acm07pmb.neonauth.sa-east-1.aws.neon.tech/neondb/auth
        run: pnpm build
      - name: Fallback SPA nas rotas
        run: |
          cp dist/index.html dist/404.html
          for route in login cadastro perfil resultados; do
            mkdir -p "dist/${route}"
            cp dist/index.html "dist/${route}/index.html"
          done
      - name: Publicar em /var/www/super-mega
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VULTR_HOST }}
          REMOTE_USER: ${{ secrets.VULTR_USER }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$REMOTE_HOST" ] || [ -z "$REMOTE_USER" ]; then
            echo "Faltam secrets: VULTR_SSH_KEY, VULTR_HOST e/ou VULTR_USER (Repository secrets, não Environment)."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$REMOTE_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${REMOTE_USER}@${REMOTE_HOST}" "mkdir -p /var/www/super-mega"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            dist/ "${REMOTE_USER}@${REMOTE_HOST}:/var/www/super-mega/"
