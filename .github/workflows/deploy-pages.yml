name: Publicar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Sincronizar concursos da Caixa']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sincronizar e exportar concursos do Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REQUIRED_SECRET: DATABASE_URL
          SKIP_IF_NO_URL: '1'
        run: |
          node scripts/sync-concursos-neon.mjs
          node scripts/export-concursos-json.mjs
      - name: Build
        env:
          VITE_NEON_AUTH_URL: https://ep-small-paper-acm07pmb.neonauth.sa-east-1.aws.neon.tech/neondb/auth
        run: pnpm build
      - name: Fallback SPA (404)
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
