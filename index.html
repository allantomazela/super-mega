<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEGA DOS MILIONÁRIOS</title>
    <meta name="description" content="MEGA DOS MILIONÁRIOS — otimizador estratégico da Mega-Sena com estatística e probabilidade" />
    <meta name="author" content="MEGA DOS MILIONÁRIOS" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.svg" />

    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- auth-cors-v2: never send neon_auth_session_verifier as a request header -->
    <!-- caixa-oficial-v3: last draw uses Caixa API with credentials omit -->
  </head>

  <body>
    <div id="root"></div>
    <script>
      (function () {
        var P = 'neon_auth_session_verifier'
        if (window.__neonAuthFetchPatched) return
        window.__neonAuthFetchPatched = true
        var orig = window.fetch.bind(window)
        function fromPage() {
          var q = new URLSearchParams(location.search).get(P)
          if (q) return q
          var h = location.hash.indexOf('?')
          if (h >= 0) return new URLSearchParams(location.hash.slice(h + 1)).get(P)
          try {
            return sessionStorage.getItem(P)
          } catch (e) {
            return null
          }
        }
        var initial = fromPage()
        if (initial) {
          try {
            sessionStorage.setItem(P, initial)
          } catch (e) {}
        }
        window.fetch = function (input, init) {
          init = init ? Object.assign({}, init) : {}
          var headers = new Headers(init.headers || (input && input.headers))
          var token = headers.get(P) || fromPage()
          headers.delete(P)
          if (token) {
            try {
              sessionStorage.setItem(P, token)
            } catch (e) {}
          }
          init.headers = headers
          var url = typeof input === 'string' ? input : input && input.url
          var isNeonAuth =
            url &&
            (String(url).indexOf('neonauth') !== -1 ||
              String(url).indexOf('get-session') !== -1 ||
              String(url).indexOf('/auth/') !== -1)
          if (isNeonAuth) init.credentials = init.credentials || 'include'
          else if (!init.credentials) init.credentials = 'omit'
          if (token && url && url.indexOf('get-session') !== -1) {
            var parsed = new URL(url, location.origin)
            if (!parsed.searchParams.get(P)) parsed.searchParams.set(P, token)
            input = typeof input === 'string' ? parsed.toString() : new Request(parsed.toString(), input)
          }
          return orig(input, init)
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
